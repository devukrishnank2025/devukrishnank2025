<svg width="340" height="260" viewBox="0 0 340 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4d4dff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00f2ff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0a14;stop-opacity:1"/>
    </linearGradient>
    <filter id="glowS">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label { font-family: 'Courier New', monospace; font-size: 12px; fill: #e0e0e0; }
      .pct   { font-family: 'Courier New', monospace; font-size: 11px; fill: #00f2ff; filter: url(#glowS); }
      .title { font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; fill: #00f2ff; filter: url(#glowS); }

      .b1 { animation: grow 1.2s ease 0.2s both; transform-origin: left; }
      .b2 { animation: grow 1.2s ease 0.5s both; transform-origin: left; }
      .b3 { animation: grow 1.2s ease 0.8s both; transform-origin: left; }
      .b4 { animation: grow 1.2s ease 1.1s both; transform-origin: left; }
      .b5 { animation: grow 1.2s ease 1.4s both; transform-origin: left; }
      .b6 { animation: grow 1.2s ease 1.7s both; transform-origin: left; }

      @keyframes grow {
        from { transform: scaleX(0); }
        to   { transform: scaleX(1); }
      }
    </style>
  </defs>

  <!-- Card bg -->
  <rect width="340" height="260" rx="12" fill="url(#cardGrad)" stroke="#1e1e3a" stroke-width="1.5"/>

  <!-- Title -->
  <text class="title" x="20" y="30">⚡ Dev Skills</text>
  <line x1="20" y1="38" x2="320" y2="38" stroke="#4d4dff" stroke-width="0.8" opacity="0.5"/>

  <!-- Skill: JavaScript -->
  <text class="label" x="20" y="62">JavaScript</text>
  <text class="pct"   x="300" y="62" text-anchor="end">90%</text>
  <rect x="20" y="67" width="300" height="6" rx="3" fill="#1a1a2e"/>
  <rect class="b1" x="20" y="67" width="270" height="6" rx="3" fill="url(#barGrad)"/>

  <!-- Skill: React -->
  <text class="label" x="20" y="98">React</text>
  <text class="pct"   x="300" y="98" text-anchor="end">85%</text>
  <rect x="20" y="103" width="300" height="6" rx="3" fill="#1a1a2e"/>
  <rect class="b2" x="20" y="103" width="255" height="6" rx="3" fill="url(#barGrad)"/>

  <!-- Skill: Node.js -->
  <text class="label" x="20" y="134">Node.js</text>
  <text class="pct"   x="300" y="134" text-anchor="end">80%</text>
  <rect x="20" y="139" width="300" height="6" rx="3" fill="#1a1a2e"/>
  <rect class="b3" x="20" y="139" width="240" height="6" rx="3" fill="url(#barGrad)"/>

  <!-- Skill: MongoDB -->
  <text class="label" x="20" y="170">MongoDB</text>
  <text class="pct"   x="300" y="170" text-anchor="end">78%</text>
  <rect x="20" y="175" width="300" height="6" rx="3" fill="#1a1a2e"/>
  <rect class="b4" x="20" y="175" width="234" height="6" rx="3" fill="url(#barGrad)"/>

  <!-- Skill: Python -->
  <text class="label" x="20" y="206">Python</text>
  <text class="pct"   x="300" y="206" text-anchor="end">65%</text>
  <rect x="20" y="211" width="300" height="6" rx="3" fill="#1a1a2e"/>
  <rect class="b5" x="20" y="211" width="195" height="6" rx="3" fill="url(#barGrad)"/>

  <!-- Skill: GraphQL -->
  <text class="label" x="20" y="242">GraphQL</text>
  <text class="pct"   x="300" y="242" text-anchor="end">60%</text>
  <rect x="20" y="247" width="300" height="6" rx="3" fill="#1a1a2e"/>
  <rect class="b6" x="20" y="247" width="180" height="6" rx="3" fill="url(#barGrad)"/>
</svg>
